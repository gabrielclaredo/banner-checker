name: Banner Checker — Bemol

on:
  workflow_dispatch:
    inputs:
      data_simulada:
        description: 'Insira data para teste. Deixe vazio para data automática.'
        required: false
        default: ''

jobs:
  check-banners:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Cache Playwright (Chromium)
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-1.49.0

      - name: Instalar leitor de texto (OCR)
        continue-on-error: true
        timeout-minutes: 6
        run: |
          for tentativa in 1 2 3; do
            echo "Tentativa $tentativa de instalar o OCR..."
            if sudo apt-get update -qq -o Acquire::Retries=3 && \
               sudo apt-get install -y -qq -o Acquire::Retries=3 tesseract-ocr tesseract-ocr-por; then
              echo "OCR instalado."
              exit 0
            fi
            sleep 20
          done
          echo "::warning::Não foi possível instalar o OCR. A checagem de links segue; o e-mail vai avisar que o leitor de datas falhou."
          exit 1

      - name: Instalar dependências Python
        run: pip install -r requirements.txt pytesseract pillow

      - name: Instalar Chromium e dependências do sistema
        run: |
          playwright install chromium
          playwright install-deps chromium

      - name: Rodar verificação
        env:
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          DATA_SIMULADA: ${{ inputs.data_simulada }}
        run: python checker.py

      - name: Salvar relatório como artefato
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-banners-${{ github.run_number }}
          path: report_banners.html
          retention-days: 30
