name: Banner Checker — Bemol

on:
  workflow_dispatch:
    inputs:
      data_simulada:
        description: 'SÓ PARA TESTE: fingir que hoje é esta data (ex.: 2026-12-31). Deixe vazio para uso normal.'
        required: false
        default: ''

jobs:
  check-banners:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Cache Playwright (Chromium)
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-1.49.0

      - name: Cache do leitor de texto (OCR)
        uses: actions/cache@v4
        with:
          path: ~/ocr-debs
          key: ocr-debs-ubuntu-24.04-v1

      - name: Instalar leitor de texto (OCR)
        continue-on-error: true
        timeout-minutes: 6
        run: |
          APT="-o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20"
          # 1) Usa a cópia guardada, se existir (não depende do servidor do Ubuntu)
          if ls ~/ocr-debs/*.deb >/dev/null 2>&1 && sudo dpkg -i ~/ocr-debs/*.deb; then
            echo "OCR instalado a partir da cópia guardada."
            exit 0
          fi
          # 2) Senão, baixa (até 3 tentativas) e guarda uma cópia pras próximas vezes
          for tentativa in 1 2 3; do
            echo "Tentativa $tentativa de baixar o OCR..."
            if sudo apt-get update -qq $APT && \
               sudo apt-get install -y -qq --download-only $APT tesseract-ocr tesseract-ocr-por; then
              mkdir -p ~/ocr-debs
              cp /var/cache/apt/archives/*.deb ~/ocr-debs/
              sudo dpkg -i ~/ocr-debs/*.deb && echo "OCR instalado." && exit 0
            fi
            sleep 15
          done
          echo "::warning::Não foi possível instalar o OCR. A checagem de links segue; o e-mail vai avisar que o leitor de datas falhou."
          exit 1

      - name: Instalar dependências Python
        run: pip install -r requirements.txt pytesseract pillow

      - name: Instalar Chromium
        run: playwright install chromium

      - name: Instalar dependências do sistema do Chromium
        continue-on-error: true
        timeout-minutes: 6
        run: playwright install-deps chromium

      - name: Rodar verificação
        env:
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          DATA_SIMULADA: ${{ inputs.data_simulada }}
        run: python checker.py

      - name: Salvar relatório como artefato
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-banners-${{ github.run_number }}
          path: report_banners.html
          retention-days: 30
