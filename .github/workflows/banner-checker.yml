name: Banner Checker — Bemol

on:
  workflow_dispatch:
    inputs:
      data_simulada:
        description: 'SÓ PARA TESTE: fingir que hoje é esta data (ex.: 2026-12-31). Deixe vazio para uso normal.'
        required: false
        default: ''

jobs:
  check-banners:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Cache Playwright (Chromium)
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-1.49.0

      - name: Cache do dicionário do leitor
        uses: actions/cache@v4
        with:
          path: ~/tessdata
          key: tessdata-por-v1

      - name: Instalar dependências Python (inclui o leitor de texto)
        run: pip install -r requirements.txt tesserocr pillow

      - name: Baixar dicionário de português do leitor
        continue-on-error: true
        run: |
          mkdir -p ~/tessdata
          if [ ! -s ~/tessdata/por.traineddata ]; then
            curl -fsSL --retry 3 --max-time 60 -o ~/tessdata/por.traineddata \
              https://github.com/tesseract-ocr/tessdata_fast/raw/main/por.traineddata
          fi
          ls -la ~/tessdata

      - name: Instalar Chromium
        run: playwright install chromium

      - name: Instalar dependências do sistema do Chromium
        continue-on-error: true
        timeout-minutes: 4
        run: playwright install-deps chromium

      - name: Rodar verificação
        env:
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          DATA_SIMULADA: ${{ inputs.data_simulada }}
        run: python checker.py

      - name: Salvar relatório como artefato
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-banners-${{ github.run_number }}
          path: report_banners.html
          retention-days: 30
